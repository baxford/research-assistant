<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Researcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 320px;
      padding: 16px;
      background: #fff;
      color: #222;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    #url {
      font-size: 11px;
      color: #666;
      word-break: break-all;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    #doi {
      font-size: 11px;
      color: #888;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 8px 0;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      min-height: 20px;
      text-align: center;
    }
    .success { color: #1a7340; }
    .error { color: #c0392b; }
    .info { color: #888; }
  </style>
</head>
<body>
  <h1>Researcher</h1>
  <div id="url" class="info">Loading…</div>
  <div id="doi"></div>
  <button id="save-btn" disabled>Save Page</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
